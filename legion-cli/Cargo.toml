[package]
name = "legion-cli"
version = "1.6.0"
edition = "2021"
authors = ["AayamPokhrel <pokhrelaayam1010@gmail.com>"]
description = "Native Linux userspace driver and CLI utility for Lenovo Legion laptops"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AayamPokhrel/LegionSpace4Linux"
default-run = "legion-cli"

[lib]
name = "legion_cli"
path = "src/lib.rs"

[[bin]]
name = "legion-cli"
path = "src/main.rs"

[[bin]]
name = "legionctl"
path = "src/bin/legionctl.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
libc = "0.2"
